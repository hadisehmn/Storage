name: Storage Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: storage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d storage_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Download dependencies
        run: go mod download

      - name: Setup database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/storage_test
        run: psql "$DATABASE_URL" -f db.sql

      - name: Run Go tests
        run: go test ./...
     

  docker:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t hadi3eh/storage:${{ github.sha }} .

      - name: Push Docker image
        run: docker push hadi3eh/storage:${{ github.sha }}
          deploy:
    name: Deploy to Server
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH connection
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keygen -lf ~/.ssh/deploy_key

          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ubuntu@batman.dumas.ir \
            "whoami && hostname && docker --version"
            

